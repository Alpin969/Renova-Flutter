name: renova
description: "Aplikasi RENOVA - pemesanan dan manajemen laundry"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Komunikasi HTTP ke REST API RENOVA.
  http: ^1.6.0

  # Token JWT disimpan di penyimpanan aman milik sistem
  # (Keystore/Keychain, dan WebCrypto di web).
  flutter_secure_storage: ^11.2.0

  # Mengambil foto pesanan dari galeri atau kamera.
  image_picker: ^1.2.4

  # Hanya untuk MediaType saat mengirim multipart/form-data.
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
